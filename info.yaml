# Tiny Tapeout project information
project:
  title:        "128-bit Bit-Serial Integer Accumulator"
  author:       "Phillip Moore"
  discord:      ""
  description:  "Exact 128-bit integer arithmetic from one full adder. Bit-serial add and subtract in 130 cycles, with shift, swap and byte I/O. Companion to the ternary MLP tile."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  # MEASURED at 2x2 (run 40520428533): 25,092 um^2 of post-PnR standard
  # cells on a 75,602 um^2 die - 33.2% utilization, i.e. the design was
  # paying for twice the silicon it used. On a 1x2 die (~37,801 um^2) the
  # same cells are 66.4%, above LibreLane's 60 default but inside the ~80
  # that is reported workable. The aspect ratio also changes, so routing is
  # the real risk rather than placement density.
  #
  # If global placement fails with GPL-0302, first raise
  # PL_TARGET_DENSITY_PCT in src/config.json; if routing fails, go back to
  # "2x2" - it is known good.
  tiles: "1x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pcm_bigint"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_pcm_bigint.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "data byte in bit 0"
  ui[1]: "data byte in bit 1"
  ui[2]: "data byte in bit 2"
  ui[3]: "data byte in bit 3"
  ui[4]: "data byte in bit 4"
  ui[5]: "data byte in bit 5"
  ui[6]: "data byte in bit 6"
  ui[7]: "data byte in bit 7"

  # Outputs
  uo[0]: "data byte out bit 0"
  uo[1]: "data byte out bit 1"
  uo[2]: "data byte out bit 2"
  uo[3]: "data byte out bit 3"
  uo[4]: "data byte out bit 4"
  uo[5]: "data byte out bit 5"
  uo[6]: "data byte out bit 6"
  uo[7]: "data byte out bit 7"

  # Bidirectional pins
  uio[0]: "opcode bit 0 (in)"
  uio[1]: "opcode bit 1 (in)"
  uio[2]: "opcode bit 2 (in)"
  uio[3]: "strobe (in)"
  uio[4]: "busy (out)"
  uio[5]: "done (out)"
  uio[6]: "zero flag, A == 0 (out)"
  uio[7]: "carry out / not borrow (out)"

# Do not change!
yaml_version: 6
